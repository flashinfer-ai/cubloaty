[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cubloaty"
dynamic = ["version"]
description = "Analyze CUDA binary sizes in .so files - bloaty for CUDA kernels"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "FlashInfer team"}
]
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "rich>=10.0.0",
    # fatbin entries are LZ4- or ZSTD-compressed; Python 3.14+ ships zstd
    "lz4>=3.0",
    "zstandard>=0.15; python_version < '3.14'",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
cubloaty = "cubloaty.cli:main"

[project.urls]
Homepage = "https://github.com/flashinfer-ai/cubloaty"

[tool.setuptools]
packages = ["cubloaty"]

[tool.setuptools.dynamic]
version = {attr = "cubloaty.__version__"}
